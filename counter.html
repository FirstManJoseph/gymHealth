<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final Website HTML and CSS</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts Links For Icon -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a class="logo" href="#">Gym Health</a>
        <ul class="menu-links">
          <li id="home"><a href="./index.html">Home</a></li>
          <li id="findGym"><a href="#">Find A Gym</a></li>
          <li id="training"><a href="#">Training</a></li>
          <li id="whyJoinUs"><a href="#">Why Join Us</a></li>
          <li id="eqptmnt"><a href="#">Equiptment</a></li>
          <li id="contactUs"><a href="#">Contact us</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero-section">
      <div class="content">
        <!-- <div class="counter-container"> -->
        <div>
          <!-- ========= INCREMENT & DECREMENT ================================= -->
          <button id="incrementButton">+</button>
          <button id="decrementButton">-</button>

          <!-- ========== RESET ================================ -->

          <p>Number of members: <span id="counter">0</span></p>
        </div>
        <!-- ========== FORMS ================================ -->

        <div class="groupName">
          <label for="username">Type your group name</label>
          <input type="text" id="username" placeholder="Group Name" />
          <button id="greetingButton">Enter</button>

          <p id="greetingMessage"></p>
        </div>
        <div class="welcomeMessage">
          <!-- ========== DOM =============================== -->
          <button id="addParagraphButton">Welcoming Message</button>

          <div id="paragraphContainer"></div>
        </div>
      </div>
      <!-- </div> -->
    </section>

    <script src="counter.js"></script>
  </body>
</html>
